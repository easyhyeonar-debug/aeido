<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Aeido — Product</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;1,400&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="">

<div class="frame">
  <header id="site-header"></header>

  <div class="breadcrumb" id="breadcrumb">HOME / ...</div>

  <div class="detail-grid">
    <div class="detail-photo" id="detail-photo"></div>
    <div class="detail-info">
      <div class="detail-category" id="detail-category"></div>
      <div class="detail-name" id="detail-name"></div>
      <div class="detail-price" id="detail-price"></div>
      <div class="detail-desc" id="detail-desc"></div>

      <div class="detail-divider"></div>

      <div class="detail-label">LENS COLOR</div>
      <div class="chip-row" id="lens-color-row"></div>

      <div class="detail-label">QUANTITY</div>
      <div class="qty-stepper" id="qty-stepper">
        <button type="button" id="qty-minus" aria-label="수량 줄이기">&#8722;</button>
        <span id="qty-value">1</span>
        <button type="button" id="qty-plus" aria-label="수량 늘리기">&#43;</button>
      </div>

      <div class="detail-actions">
        <button class="btn" id="add-to-bag">ADD TO BAG</button>
        <button class="btn btn-primary" id="buy-now">BUY NOW</button>
      </div>
    </div>
  </div>

  <div id="spec-rows"></div>

  <div class="section-label-row">
    <span class="section-label">details</span>
  </div>
  <div class="details-grid" id="details-grid"></div>

  <div class="section-label-row">
    <span class="section-label">you may also like</span>
  </div>
  <div class="product-grid" id="related-grid"></div>

  <footer id="site-footer"></footer>
</div>

<script src="js/icons.js"></script>
<script src="js/content.js"></script>
<script src="js/data.js"></script>
<script src="js/productArt.js"></script>
<script src="js/helpers.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/layout.js"></script>
<script src="js/product.js"></script>
</body>
</html>
