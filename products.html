<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aeido — Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;1,400&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="">

<div class="frame">
  <header id="site-header" class="site-header"></header>

  <div class="filter-bar">
    <div class="filter-tabs" id="filter-tabs">
      <button data-category="">ALL</button>
      <button data-category="1">GLASSES</button>
      <button data-category="2">SUNGLASSES</button>
    </div>
    <select class="sort-select" id="sort-select">
      <option value="">NEWEST</option>
      <option value="price_asc">PRICE — LOW TO HIGH</option>
      <option value="price_desc">PRICE — HIGH TO LOW</option>
    </select>
  </div>

  <div class="product-grid" id="product-grid"></div>
  <div class="empty-state" id="empty-state" style="display:none;">조건에 맞는 상품이 없습니다.</div>

  <footer id="site-footer"></footer>
</div>

<script src="js/icons.js"></script>
<script src="js/content.js"></script>
<script src="js/data.js"></script>
<script src="js/productArt.js"></script>
<script src="js/helpers.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/layout.js"></script>
<script src="js/products.js"></script>
</body>
</html>
