<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aeido — My Page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;1,400&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="">

<div class="frame">
  <header id="site-header" class="site-header"></header>

  <div class="section-header">
    <span class="section-title">My Page</span>
  </div>

  <div class="mypage-section">
    <div class="detail-label">LOGIN</div>
    <form id="login-form">
      <div class="field">
        <label for="email">EMAIL</label>
        <input class="text-input" type="email" id="email" placeholder="name@email.com" required>
      </div>
      <div class="field">
        <label for="password">PASSWORD</label>
        <input class="text-input" type="password" id="password" placeholder="비밀번호" required>
      </div>
      <button class="btn btn-primary" type="submit">LOGIN</button>
      <div class="mypage-links">
        <a href="#" id="signup-link">회원가입</a>
        <span>&#183;</span>
        <a href="#" id="find-pw-link">비밀번호 찾기</a>
      </div>
    </form>
  </div>

  <div class="mypage-section">
    <div class="detail-label">ORDER HISTORY</div>
    <div class="empty-state" style="padding:30px 0;">로그인 후 주문 내역을 확인할 수 있습니다.</div>
  </div>

  <footer id="site-footer"></footer>
</div>

<script src="js/icons.js"></script>
<script src="js/content.js"></script>
<script src="js/data.js"></script>
<script src="js/productArt.js"></script>
<script src="js/helpers.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/layout.js"></script>
<script src="js/mypage.js"></script>
</body>
</html>
