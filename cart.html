<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aeido — Cart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;1,400&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="">

<div class="frame">
  <header id="site-header" class="site-header"></header>

  <div class="section-header">
    <span class="section-title">Cart</span>
    <span id="cart-item-count" style="font-family:'Roboto',sans-serif; font-size:12px; color:#9a9a96;"></span>
  </div>

  <div id="cart-rows"></div>
  <div class="empty-state" id="cart-empty" style="display:none;">
    장바구니가 비어 있습니다.
    <div><a class="btn" href="products.html">SHOP NOW</a></div>
  </div>

  <div class="cart-summary" id="cart-summary" style="display:none;">
    <div class="cart-summary-box">
      <div class="summary-row"><span>Subtotal</span><span class="val" id="summary-subtotal"></span></div>
      <div class="summary-row"><span>Shipping</span><span class="val">Free</span></div>
      <div class="summary-divider"></div>
      <div class="summary-total"><span>Total</span><span class="val" id="summary-total"></span></div>
      <button class="btn btn-primary" id="checkout-btn">CHECKOUT</button>
    </div>
  </div>

  <footer id="site-footer"></footer>
</div>

<script src="js/icons.js"></script>
<script src="js/content.js"></script>
<script src="js/data.js"></script>
<script src="js/productArt.js"></script>
<script src="js/helpers.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/layout.js"></script>
<script src="js/cart-page.js"></script>
</body>
</html>
